name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Test Suite
      run: |
        python test_skills.py

    - name: Test CLI Runner and Exports
      run: |
        python run_skill.py --categories
        python run_skill.py --list
        python run_skill.py --search tevkifat
        python run_skill.py --run efatura-kdv-tevkifat-denetleyici --mock
        python run_skill.py --export-json
        python run_skill.py --export-claude
        python run_skill.py --export-cursor
